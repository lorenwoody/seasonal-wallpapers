name: Seasonal wallpapers

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # 08:15 UTC = 02:15 CST / 03:15 CDT, after Chicago midnight all year.
    - cron: '15 8 * * *'
  workflow_dispatch:
    inputs:
      season:
        description: Season override for this run only
        type: choice
        default: auto
        options: [auto, fall, halloween, christmas, winter, spring, summer]
      apply:
        description: Write to the live Gist (also requires GIST_UPDATES_ENABLED=true)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Test season boundaries, playlists, and mocked API writes
        run: python3 -m unittest discover -s tests -v
      - name: Dry run
        env:
          SELECTED_SEASON: ${{ inputs.season || 'auto' }}
        run: python3 scripts/update_gist.py --dry-run --season "$SELECTED_SEASON"

  publish:
    needs: validate
    # Deployment is opt-in. PRs and pushes never write. Only the default branch may write.
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      vars.GIST_UPDATES_ENABLED == 'true' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && inputs.apply == true))
    runs-on: ubuntu-latest
    concurrency:
      group: seasonal-wallpapers-gist
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Update existing Gist content if changed
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_FILENAME: ${{ vars.GIST_FILENAME }}
          SELECTED_SEASON: ${{ inputs.season || 'auto' }}
        run: python3 scripts/update_gist.py --apply --season "$SELECTED_SEASON"
